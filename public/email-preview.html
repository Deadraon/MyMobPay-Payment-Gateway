  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand-col {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-col img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 11px;
      color: #64748b;
    }
    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .template-select {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .template-select:focus {
      border-color: #0f172a;
    }
    .view-toggles {
      display: inline-flex;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 3px;
    }
    .view-btn {
      background: transparent;
      border: none;
      color: #64748b;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .view-btn.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .workspace {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 14px;
      background: #f1f5f9;
      overflow-y: auto;
    }
    .preview-frame-wrapper {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 12px 24px -6px rgba(0,0,0,0.04);
      border: 1px solid #e2e8f0;
      overflow: hidden;
      transition: max-width 0.2s ease;
      width: 100%;
      max-width: 600px;
    }
    .preview-frame-wrapper.mobile {
      max-width: 375px;
    }
    iframe {
      width: 100%;
      min-height: 820px;
      border: none;
      display: block;
      background: #f8fafc;
    }

    @media (max-width: 640px) {
      header {
        padding: 10px 12px;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .controls-row {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        gap: 8px;
      }
      .template-select {
        width: 100%;
      }
      .view-toggles {
        display: flex;
        width: 100%;
      }
      .view-btn {
        flex: 1;
        text-align: center;
      }
      .workspace {
        padding: 12px 8px;
      }
      .preview-frame-wrapper {
        border-radius: 8px;
        max-width: 100% !important;
      }
    }
  </style>
</head>

    <div class="brand-col">
      <img src="https://mymob.tech/icon.png" alt="MyMobPay" />
      <div>

        <div class="brand-sub">Minimal &bull; Light Theme &bull; Mobile Synced</div>
      </div>
    </div>

    <div class="controls-row">

        <option value="dispute_update">8. Operations Dispute / Inquiry</option>
        <option value="official_dispatch">9. Administrator Notice</option>

      <div class="view-toggles">
        <button id="btnDesktop" class="view-btn active" onclick="setViewMode('desktop')">Desktop (600px)</button>
        <button id="btnMobile" class="view-btn" onclick="setViewMode('mobile')">Mobile (375px)</button>

    </div>
