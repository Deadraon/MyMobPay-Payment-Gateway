      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand-col {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-col img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 11px;
      color: #94a3b8;
    }
    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .template-select {
      background: #0f172a;
      color: #f1f5f9;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .view-toggles {
      display: inline-flex;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 3px;
    }
    .view-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .view-btn.active {
      background: #3b82f6;
      color: #ffffff;
    }
    .workspace {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
      background: #090d16;
      overflow-y: auto;
    }
    .preview-frame-wrapper {
      background: #f8fafc;
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
      border: 1px solid #1e293b;
      overflow: hidden;
      transition: max-width 0.25s ease;
      width: 100%;
      max-width: 720px;
    }
    .preview-frame-wrapper.mobile {
      max-width: 390px;
    }
    iframe {
      width: 100%;
      min-height: 850px;
      border: none;
      display: block;
      background: #f8fafc;
    }

      </div>

        <option value="otp_login">3. 6-Digit Security OTP (Auth)</option>

    </div>

    function renderSelectedTemplate() {
      const select = document.getElementById('templateSelector');
      const val = select.value;
      const iframe = document.getElementById('previewFrame');
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();

    function setViewMode(mode) {
      const wrapper = document.getElementById('frameWrapper');
      const btnDesk = document.getElementById('btnDesktop');
      const btnMob = document.getElementById('btnMobile');

      if (mode === 'mobile') {
        wrapper.classList.add('mobile');
        btnMob.classList.add('active');
        btnDesk.classList.remove('active');
      } else {
        wrapper.classList.remove('mobile');
        btnDesk.classList.add('active');
        btnMob.classList.remove('active');
      }
    }
